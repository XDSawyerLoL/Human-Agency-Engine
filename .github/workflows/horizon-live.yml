name: HORIZON Live Radar

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horizon-live-radar
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      ENGINE_URL: ${{ secrets.ENGINE_URL }}
      ENGINE_API_KEY: ${{ secrets.ENGINE_API_KEY }}
    steps:
      - name: Poll HORIZON world-event radar
        shell: bash
        run: |
          if [ -z "$ENGINE_URL" ] || [ -z "$ENGINE_API_KEY" ]; then
            echo "HORIZON live radar not configured yet; skipping cleanly."
            exit 0
          fi

          echo "Syncing versioned Human Response Library."
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 60 \
            -X POST "${ENGINE_URL%/}/v1/horizon/response-library/builtins/sync" \
            -H "X-API-Key: ${ENGINE_API_KEY}"

          echo
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 180 \
            -X POST "${ENGINE_URL%/}/v1/horizon/live/gdelt/poll" \
            -H "X-API-Key: ${ENGINE_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}'

          echo
          echo "Polling Météo-France official-primary feed (cleanly skips if server credential is absent)."
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 120 \
            -X POST "${ENGINE_URL%/}/v1/horizon/live/meteofrance/poll" \
            -H "X-API-Key: ${ENGINE_API_KEY}"

          echo
          echo "Normalizing latest official weather alerts into personally scoped HORIZON events."
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 120 \
            -X POST "${ENGINE_URL%/}/v1/horizon/normalize/meteofrance/latest" \
            -H "X-API-Key: ${ENGINE_API_KEY}"

          echo
          echo "Polling official French fuel rupture feed."
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 180 \
            -X POST "${ENGINE_URL%/}/v1/horizon/live/fuel-ruptures/poll" \
            -H "X-API-Key: ${ENGINE_API_KEY}"

          echo
          echo "Normalizing material fuel shortages into personally scoped events and stock signals."
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 120 \
            -X POST "${ENGINE_URL%/}/v1/horizon/normalize/fuel-ruptures/latest" \
            -H "X-API-Key: ${ENGINE_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}'

          echo
          echo "Refreshing normalized GDELT media-attention acceleration signals."
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 180 \
            -X POST "${ENGINE_URL%/}/v1/horizon/signals/media-attention/refresh" \
            -H "X-API-Key: ${ENGINE_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}'

          echo
          echo "Refreshing cross-signal HORIZON early-warning episodes."
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 180 \
            -X POST "${ENGINE_URL%/}/v1/horizon/warnings/refresh" \
            -H "X-API-Key: ${ENGINE_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"max_events":100,"recency_hours":72}'

          echo
          echo "Re-evaluating only materially changed HORIZON human trajectories."
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 240 \
            -X POST "${ENGINE_URL%/}/v1/horizon/reevaluate/run" \
            -H "X-API-Key: ${ENGINE_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"max_events":100,"max_users":5000,"material_score_delta":0.12}'
