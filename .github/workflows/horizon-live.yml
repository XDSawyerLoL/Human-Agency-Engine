name: HORIZON Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horizon-live.yml'
      - 'scripts/evidence_public_snapshot.py'
      - 'scripts/horizon_github_cycle.py'
      - 'app/services/evidence_forecast_engine.py'
      - 'app/services/human_signal_engine.py'
      - 'app/services/solution_scan.py'
      - 'app/services/horizon_*.py'
      - 'app/horizon_*.py'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: horizon-live-runtime
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Select runtime mode
        id: mode
        shell: bash
        env:
          ENGINE_URL: ${{ secrets.ENGINE_URL }}
          ENGINE_API_KEY: ${{ secrets.ENGINE_API_KEY }}
        run: |
          if [ -n "$ENGINE_URL" ] && [ -n "$ENGINE_API_KEY" ]; then
            echo "mode=remote" >> "$GITHUB_OUTPUT"
            echo "Using permanent-server watchdog mode."
          else
            echo "mode=github-only" >> "$GITHUB_OUTPUT"
            echo "No permanent server configured; using zero-cost GitHub-only fallback."
          fi

      - name: Check permanent collector and run due work
        if: steps.mode.outputs.mode == 'remote'
        shell: bash
        env:
          ENGINE_URL: ${{ secrets.ENGINE_URL }}
          ENGINE_API_KEY: ${{ secrets.ENGINE_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --max-time 60 \
            "${ENGINE_URL%/}/v1/horizon/collector/status?cycle_limit=5" \
            -H "X-API-Key: ${ENGINE_API_KEY}"
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --max-time 600 \
            -X POST "${ENGINE_URL%/}/v1/horizon/collector/run-due" \
            -H "X-API-Key: ${ENGINE_API_KEY}" -H "Content-Type: application/json" \
            --data '{"owner_id":"github-watchdog","force_sources":[]}'

      - name: Checkout HORIZON
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install HORIZON dependencies
        run: pip install -r requirements.txt

      - name: Report World Eye credential wiring
        if: steps.mode.outputs.mode == 'github-only'
        shell: bash
        env:
          METEOFRANCE_APPLICATION_ID: ${{ secrets.METEOFRANCE_APPLICATION_ID || vars.METEOFRANCE_APPLICATION_ID }}
          WINDY_POINT_FORECAST_API_KEY: ${{ secrets.WINDY_POINT_FORECAST_API_KEY || vars.WINDY_POINT_FORECAST_API_KEY || secrets.WINDY_KEY || vars.WINDY_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || vars.FRED_API_KEY }}
          METACULUS_API_KEY: ${{ secrets.METACULUS_API_KEY || vars.METACULUS_API_KEY }}
          COPERNICUS_API_KEY: ${{ secrets.COPERNICUS_API_KEY || vars.COPERNICUS_API_KEY }}
          FORECAST_API_KEY: ${{ secrets.FORECAST_API_KEY || vars.FORECAST_API_KEY || secrets.FORESCAST_API_KEY || vars.FORESCAST_API_KEY }}
          POINT_API_KEY: ${{ secrets.POINT_API_KEY || vars.POINT_API_KEY }}
          HORIZON_COLLECTOR_WINDY_POINTS_JSON: ${{ vars.HORIZON_COLLECTOR_WINDY_POINTS_JSON }}
        run: |
          set -euo pipefail
          for entry in \
            "Meteo-France:$METEOFRANCE_APPLICATION_ID" \
            "Windy:$WINDY_POINT_FORECAST_API_KEY" \
            "FRED:$FRED_API_KEY" \
            "Metaculus:$METACULUS_API_KEY" \
            "Copernicus:$COPERNICUS_API_KEY" \
            "ForecastAPI:$FORECAST_API_KEY" \
            "Point Knowledge:$POINT_API_KEY"; do
            label="${entry%%:*}"; value="${entry#*:}"
            if [ -n "$value" ]; then echo "$label credential: configured"; else echo "$label credential: missing"; fi
          done
          if [ -n "$HORIZON_COLLECTOR_WINDY_POINTS_JSON" ] && [ "$HORIZON_COLLECTOR_WINDY_POINTS_JSON" != "[]" ]; then
            echo "Windy collection points: configured"
          else
            echo "Windy collection points: default France watch grid will be used"
          fi
          echo "Metaculus is reference-only until its data-use terms explicitly permit model use."
          echo "Point Knowledge is kept separate from Windy and reserved for evidence/reference enrichment."
          echo "Secret values are intentionally never printed."

      - name: Restore previous GitHub-only state
        if: steps.mode.outputs.mode == 'github-only'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=horizon-github-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "No prior state artifact found; HORIZON will initialize a fresh SQLite state."
            exit 0
          fi
          echo "PREVIOUS_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o /tmp/horizon-state.zip
          unzip -o /tmp/horizon-state.zip -d .
          test -f horizon-github.db

      - name: Preserve previous Évidence probability trajectory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s evidence-live.json ]; then
            cp evidence-live.json evidence-previous.json
            exit 0
          fi
          encoded="$(gh api "repos/${GITHUB_REPOSITORY}/contents/evidence-live.json?ref=evidence-live-data" --jq '.content' 2>/dev/null || true)"
          if [ -n "$encoded" ]; then
            printf '%s' "$encoded" | tr -d '\n' | base64 -d > evidence-previous.json
          else
            printf '{}\n' > evidence-previous.json
          fi

      - name: Migrate GitHub-only state
        if: steps.mode.outputs.mode == 'github-only'
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./horizon-github.db
          API_KEY: change-me
        run: alembic upgrade head

      - name: Run one HORIZON collection cycle
        if: steps.mode.outputs.mode == 'github-only'
        shell: bash
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./horizon-github.db
          API_KEY: change-me
          METEOFRANCE_APPLICATION_ID: ${{ secrets.METEOFRANCE_APPLICATION_ID || vars.METEOFRANCE_APPLICATION_ID }}
          WINDY_POINT_FORECAST_API_KEY: ${{ secrets.WINDY_POINT_FORECAST_API_KEY || vars.WINDY_POINT_FORECAST_API_KEY || secrets.WINDY_KEY || vars.WINDY_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || vars.FRED_API_KEY }}
          METACULUS_API_KEY: ${{ secrets.METACULUS_API_KEY || vars.METACULUS_API_KEY }}
          COPERNICUS_API_KEY: ${{ secrets.COPERNICUS_API_KEY || vars.COPERNICUS_API_KEY }}
          FORECAST_API_KEY: ${{ secrets.FORECAST_API_KEY || vars.FORECAST_API_KEY || secrets.FORESCAST_API_KEY || vars.FORESCAST_API_KEY }}
          POINT_API_KEY: ${{ secrets.POINT_API_KEY || vars.POINT_API_KEY }}
          HORIZON_COLLECTOR_ENABLED: 'true'
          HORIZON_COLLECTOR_MAX_SOURCES_PER_CYCLE: '10'
          HORIZON_COLLECTOR_METEOALARM_ALL_EUROPE: 'true'
          HORIZON_COLLECTOR_WINDY_POINTS_JSON: ${{ vars.HORIZON_COLLECTOR_WINDY_POINTS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${HORIZON_COLLECTOR_WINDY_POINTS_JSON:-}" ] || [ "$HORIZON_COLLECTOR_WINDY_POINTS_JSON" = "[]" ]; then
            export HORIZON_COLLECTOR_WINDY_POINTS_JSON='[{"lat":48.8566,"lon":2.3522,"geography":["FR","Paris"]},{"lat":45.7640,"lon":4.8357,"geography":["FR","Lyon"]},{"lat":43.2965,"lon":5.3698,"geography":["FR","Marseille"]},{"lat":43.6047,"lon":1.4442,"geography":["FR","Toulouse"]},{"lat":44.8378,"lon":-0.5792,"geography":["FR","Bordeaux"]}]'
          fi
          python scripts/horizon_github_cycle.py

      - name: Build sanitized Évidence predictive snapshot
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./horizon-github.db
          API_KEY: change-me
          ENGINE_URL: ${{ secrets.ENGINE_URL }}
          ENGINE_API_KEY: ${{ secrets.ENGINE_API_KEY }}
        run: |
          python scripts/evidence_public_snapshot.py --output evidence-live.json --previous evidence-previous.json --forecast-limit 20
          test -s evidence-live.json

      - name: Publish Évidence public live feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_path="repos/${GITHUB_REPOSITORY}/contents/evidence-live.json"
          file_sha="$(gh api "${api_path}?ref=evidence-live-data" --jq '.sha' 2>/dev/null || true)"
          payload="$(base64 -w 0 evidence-live.json)"
          args=(--method PUT "$api_path" -f message="Update Évidence World Eye snapshot" -f content="$payload" -f branch="evidence-live-data")
          if [ -n "$file_sha" ]; then args+=( -f sha="$file_sha" ); fi
          gh api "${args[@]}" >/dev/null
          echo "Published Évidence World Eye snapshot to evidence-live-data."

      - name: Validate SQLite state
        if: steps.mode.outputs.mode == 'github-only'
        shell: bash
        run: |
          test -s horizon-github.db
          test -s horizon-github-status.json
          sqlite3 horizon-github.db 'PRAGMA integrity_check;' | grep -qx 'ok'

      - name: Upload current GitHub-only state
        if: steps.mode.outputs.mode == 'github-only'
        uses: actions/upload-artifact@v4
        with:
          name: horizon-github-state
          path: |
            horizon-github.db
            horizon-github-status.json
            evidence-live.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Delete predecessor state artifact
        if: steps.mode.outputs.mode == 'github-only'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${PREVIOUS_ARTIFACT_ID:-}" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREVIOUS_ARTIFACT_ID}"
          fi
