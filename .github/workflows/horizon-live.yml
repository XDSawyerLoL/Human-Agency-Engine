name: HORIZON Collector Watchdog

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horizon-collector-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    env:
      ENGINE_URL: ${{ secrets.ENGINE_URL }}
      ENGINE_API_KEY: ${{ secrets.ENGINE_API_KEY }}
    steps:
      - name: Check permanent collector and run due work only if lease allows
        shell: bash
        run: |
          if [ -z "$ENGINE_URL" ] || [ -z "$ENGINE_API_KEY" ]; then
            echo "HORIZON endpoint not configured yet; watchdog skipping cleanly."
            exit 0
          fi

          echo "Collector status:"
          curl --fail-with-body --silent --show-error \
            --retry 2 --max-time 60 \
            "${ENGINE_URL%/}/v1/horizon/collector/status?cycle_limit=5" \
            -H "X-API-Key: ${ENGINE_API_KEY}"

          echo
          echo "Watchdog run-due request. A healthy Hostinger worker keeps the DB lease and this returns standby; an expired lease lets the watchdog recover due work."
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 600 \
            -X POST "${ENGINE_URL%/}/v1/horizon/collector/run-due" \
            -H "X-API-Key: ${ENGINE_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"owner_id":"github-watchdog","force_sources":[]}'
