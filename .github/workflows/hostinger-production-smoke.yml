name: Hostinger Production Smoke

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.js'
      - 'server_core.js'
      - 'package.json'
      - '.github/workflows/hostinger-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify deployed Providence and native Mairaiy on Hostinger
        env:
          BASE_URL: https://mediumorchid-badger-314305.hostingersite.com
        run: |
          set -euo pipefail

          deployed=0
          for attempt in $(seq 1 45); do
            app_code="$(curl -sS --max-time 15 -o /tmp/app-health.json -w '%{http_code}' "$BASE_URL/api/health" || true)"
            voice_code="$(curl -sS --max-time 15 -o /tmp/voice-status.json -w '%{http_code}' "$BASE_URL/voice/status" || true)"
            schema="$(python - <<'PY'
          import json
          try:
              with open('/tmp/voice-status.json', encoding='utf-8') as f:
                  print(json.load(f).get('schema', ''))
          except Exception:
              print('')
          PY
          )"
            echo "attempt=$attempt app_http=$app_code voice_http=$voice_code voice_schema=$schema"
            if [ "$app_code" = "200" ]               && [ "$voice_code" = "200" ]               && [ "$schema" = "quantic-mairaiy-voice-proxy-v3" ]; then
              deployed=1
              break
            fi
            sleep 10
          done

          if [ "$deployed" != "1" ]; then
            echo "Hostinger did not expose Mairaiy v3 in time."
            cat /tmp/app-health.json 2>/dev/null || true
            echo
            cat /tmp/voice-status.json 2>/dev/null || true
            exit 1
          fi

          python - <<'PY'
          import json
          with open('/tmp/voice-status.json', encoding='utf-8') as f:
              voice = json.load(f)
          assert voice.get('schema') == 'quantic-mairaiy-voice-proxy-v3', voice
          assert voice.get('configured') is True, voice
          assert voice.get('mode') == 'node-native', voice
          assert voice.get('engine') == 'kokoro-onnx-node', voice
          assert voice.get('voice') == 'ff_siwis', voice
          assert voice.get('language') == 'fr-fr', voice
          assert voice.get('identity_locked') is True, voice
          assert voice.get('zero_api_cost') is True, voice
          assert voice.get('public_speech_enabled') is True, voice
          print('Mairaiy Node route deployed:', voice.get('state'))
          PY

          echo "Triggering real production synthesis. First run may download the q8 Kokoro model."
          speech_code="$(curl -sS --max-time 240             -H 'Content-Type: application/json'             -o /tmp/mairaiy.wav             -w '%{http_code}'             -X POST "$BASE_URL/voice/v1/audio/speech"             -d '{"model":"kokoro","input":"Bonjour. Je suis Mairaiy.","voice":"mairaiy","response_format":"wav","speed":1}' || true)"

          echo "Mairaiy synthesis HTTP=$speech_code bytes=$(wc -c </tmp/mairaiy.wav 2>/dev/null || echo 0)"
          if [ "$speech_code" != "200" ]; then
            echo "Mairaiy synthesis response:"
            cat /tmp/mairaiy.wav 2>/dev/null || true
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          audio = Path('/tmp/mairaiy.wav').read_bytes()
          assert len(audio) > 1000, len(audio)
          assert audio[:4] == b'RIFF', audio[:16]
          assert audio[8:12] == b'WAVE', audio[:16]
          print('Real Mairaiy WAV verified:', len(audio), 'bytes')
          PY

          voice_code="$(curl -sS --max-time 20 -o /tmp/voice-status-after.json -w '%{http_code}' "$BASE_URL/voice/status" || true)"
          test "$voice_code" = "200"

          pulse_code="$(curl -sS --max-time 20 -o /tmp/pulse-health.json -w '%{http_code}' "$BASE_URL/api/pulse/health" || true)"
          test "$pulse_code" = "200"

          echo "Mairaiy status after synthesis:"
          cat /tmp/voice-status-after.json
          echo

          python - <<'PY'
          import json

          with open('/tmp/app-health.json', encoding='utf-8') as f:
              app = json.load(f)
          with open('/tmp/pulse-health.json', encoding='utf-8') as f:
              pulse = json.load(f)
          with open('/tmp/voice-status-after.json', encoding='utf-8') as f:
              voice = json.load(f)

          assert app.get('service') == 'evidence-world-eye-node', app
          assert app.get('status') in {'ok', 'degraded', 'warming'}, app
          assert pulse.get('ok') is True, pulse
          assert voice.get('state') == 'ready', voice
          assert voice.get('model_ready') is True, voice
          assert int(voice.get('generated_count') or 0) >= 1, voice
          assert voice.get('engine') == 'kokoro-onnx-node', voice
          assert voice.get('voice') == 'ff_siwis', voice

          print('Hostinger production app reachable:', app.get('status'))
          print('Pulse production reachable:', pulse.get('storage'))
          print('Mairaiy native production verified:', voice)
          PY
