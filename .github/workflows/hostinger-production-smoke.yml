name: Hostinger Production Smoke

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'server.js'
      - 'server_core.js'
      - 'package.json'
      - '.github/workflows/hostinger-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed Quantic portal on Hostinger
        env:
          BASE_URL: https://mediumorchid-badger-314305.hostingersite.com
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            root="$(curl -fsSL --max-time 20 "$BASE_URL/" 2>/dev/null || true)"
            centre="$(curl -fsSL --max-time 20 "$BASE_URL/quantic/" 2>/dev/null || true)"
            network="$(curl -fsSL --max-time 20 "$BASE_URL/network/" 2>/dev/null || true)"
            plans="$(curl -fsSL --max-time 20 "$BASE_URL/plans/" 2>/dev/null || true)"
            pulse="$(curl -fsSL --max-time 20 "$BASE_URL/pulse/" 2>/dev/null || true)"
            pulse_health="$(curl -fsSL --max-time 20 "$BASE_URL/api/pulse/health" 2>/dev/null || true)"
            downloads="$(curl -fsSL --max-time 20 "$BASE_URL/downloads/" 2>/dev/null || true)"
            qmark="$(curl -fsSL --max-time 20 "$BASE_URL/assets/brand-2026/quantic-sillage-mark.svg" 2>/dev/null || true)"
            pulsemark="$(curl -fsSL --max-time 20 "$BASE_URL/assets/brand-2026/pulse-mark.svg" 2>/dev/null || true)"
            mailmark="$(curl -fsSL --max-time 20 "$BASE_URL/assets/brand-2026/mail-mark.svg" 2>/dev/null || true)"
            newsmark="$(curl -fsSL --max-time 20 "$BASE_URL/assets/brand-2026/news-mark.svg" 2>/dev/null || true)"
            visionmark="$(curl -fsSL --max-time 20 "$BASE_URL/assets/brand-2026/vision-mark.svg" 2>/dev/null || true)"
            studiomark="$(curl -fsSL --max-time 20 "$BASE_URL/assets/brand-2026/studio-mark.svg" 2>/dev/null || true)"
            if grep -q 'q-hero-stage' <<<"$root" \
              && grep -q 'quantic-unified.css?v=3.0' <<<"$root" \
              && grep -q 'quantic-finish-v4.css' <<<"$root" \
              && grep -q 'Quantic ID' <<<"$centre" \
              && grep -q 'quantic-unified.css?v=3.0' <<<"$centre" \
              && grep -q '<title>Quantic Network</title>' <<<"$network" \
              && grep -q 'id="network"' <<<"$downloads" \
              && grep -q 'quantic-unified.css?v=3.0' <<<"$plans" \
              && grep -q 'ACCÈS QUANTIC' <<<"$plans" \
              && grep -q 'Quantic Studio 2.7.4' <<<"$downloads" \
              && grep -q 'QuanticStudio-Setup-2.7.4.exe' <<<"$downloads" \
              && grep -q '/assets/brand-2026/studio-mark.svg' <<<"$downloads" \
              && grep -q 'Produits &amp; outils' <<<"$downloads" \
              && grep -q 'Quantic Glide 1.2.6' <<<"$downloads" \
              && grep -q 'Quantic-Glide-1.2.6-x64.exe' <<<"$downloads" \
              && grep -q 'quantic-v2-d9f379d4f6a3' <<<"$downloads" \
              && grep -q '/assets/brand-2026/vision-mark.svg' <<<"$downloads" \
              && grep -q '/assets/brand-2026/mail-mark.svg' <<<"$downloads" \
              && grep -q '/assets/brand-2026/pulse-mark.svg' <<<"$downloads" \
              && grep -q '/assets/brand-2026/news-mark.svg' <<<"$downloads" \
              && grep -q '/assets/brand-2026/quantic-sillage-mark.svg' <<<"$pulse" \
              && grep -q '/assets/brand-2026/pulse-mark.svg' <<<"$pulse" \
              && grep -q '/pulse/app.js?v=10' <<<"$pulse" \
              && grep -q '"schema":"quantic-pulse-health-v2"' <<<"$pulse_health" \
              && grep -q 'Quantic Sillage' <<<"$qmark" \
              && grep -q 'aria-label="Quantic Pulse"' <<<"$pulsemark" \
              && grep -q 'aria-label="Quantic Mail"' <<<"$mailmark" \
              && grep -q 'aria-label="Quantic News"' <<<"$newsmark" \
              && grep -q 'aria-label="Quantic Vision"' <<<"$visionmark" \
              && grep -q 'Quantic Studio' <<<"$studiomark"; then
              ready=1
              echo "Hostinger is serving Quantic 2026 branding and product logos."
              break
            fi
            echo "Hostinger deployment not ready yet (attempt $attempt/36)."
            sleep 10
          done
          test "$ready" = "1"

          # Private applications are healthy only when the anonymous server guard redirects to Quantic ID.
          for private_path in /vision/ /predictions/ /mail/; do
            headers="/tmp/private-headers-$(echo "$private_path" | tr -cd '[:alnum:]').txt"
            code="$(curl -sS --max-time 20 --output /dev/null --dump-header "$headers" --write-out '%{http_code}' "$BASE_URL$private_path")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); print substr($0,index($0,":")+2); exit}' "$headers")"
            echo "Private guard $private_path -> HTTP $code location=$location"
            test "$code" = "302"
            grep -Eqi '^location: .*\/quantic\/\?next=' "$headers"
          done

          app_health_code="$(curl -sS --max-time 25 --output /tmp/quantic-app-health.json --write-out '%{http_code}' "$BASE_URL/api/health")"
          pulse_health_code="$(curl -sS --max-time 25 --output /tmp/quantic-pulse-health.json --write-out '%{http_code}' "$BASE_URL/api/pulse/health")"
          status_code="$(curl -sS --max-time 25 --output /tmp/quantic-status.json --write-out '%{http_code}' "$BASE_URL/api/quantic-portal/status")"
          relay_a_code="$(curl -sS --max-time 25 --output /tmp/quantic-relay-health-a.json --write-out '%{http_code}' "$BASE_URL/api/quantic/health")"
          sleep 1
          relay_b_code="$(curl -sS --max-time 25 --output /tmp/quantic-relay-health-b.json --write-out '%{http_code}' "$BASE_URL/api/quantic/health")"
          echo "Health HTTP codes: app=$app_health_code pulse=$pulse_health_code portal=$status_code relayA=$relay_a_code relayB=$relay_b_code"
          echo "App health: $(cat /tmp/quantic-app-health.json)"
          echo "Pulse health: $(cat /tmp/quantic-pulse-health.json)"
          echo "Portal status: $(cat /tmp/quantic-status.json)"
          echo "Relay health A: $(cat /tmp/quantic-relay-health-a.json)"
          test "$app_health_code" = "200"
          test "$pulse_health_code" = "200"
          test "$status_code" = "200"
          test "$relay_a_code" = "200"
          test "$relay_b_code" = "200"
          python - <<'PY'
          import json
          with open('/tmp/quantic-app-health.json', encoding='utf-8') as handle:
              app_health = json.load(handle)
          with open('/tmp/quantic-pulse-health.json', encoding='utf-8') as handle:
              pulse_health = json.load(handle)
          assert app_health.get('status') == 'ok', app_health
          assert app_health.get('ready_for_production') is True, app_health
          assert app_health.get('persistent_learning') is True, app_health
          assert app_health.get('storage') == 'mysql', app_health
          assert pulse_health.get('ok') is True, pulse_health
          assert pulse_health.get('storage') in {'mysql','postgres','supabase'}, pulse_health
          assert pulse_health.get('persistent') is True, pulse_health
          assert pulse_health.get('messageRetentionHours') == 24, pulse_health

          with open('/tmp/quantic-status.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          ids = {service.get('id') for service in payload.get('services', [])}
          expected = {'vision', 'mail', 'relay-render', 'relay-railway', 'relay-hostinger'}
          assert payload.get('status') == 'ok', payload
          assert all(service.get('functional') is True for service in payload.get('services', []) if service.get('state') == 'active'), payload
          assert expected <= ids, (expected, ids)
          hostinger = next(service for service in payload['services'] if service.get('id') == 'relay-hostinger')
          mail = next(service for service in payload['services'] if service.get('id') == 'mail')
          assert hostinger.get('state') == 'active', hostinger
          assert hostinger.get('url') == 'https://mediumorchid-badger-314305.hostingersite.com', hostinger
          assert hostinger.get('reachable') is True, hostinger
          assert hostinger.get('functional') is True, hostinger
          assert hostinger.get('http_status') == 200, hostinger
          assert mail.get('state') == 'active', mail
          assert mail.get('url') == '/mail/', mail
          assert mail.get('reachable') is True, mail
          assert mail.get('functional') is True, mail

          with open('/tmp/quantic-relay-health-a.json', encoding='utf-8') as handle:
              health_a = json.load(handle)
          with open('/tmp/quantic-relay-health-b.json', encoding='utf-8') as handle:
              health_b = json.load(handle)
          for health in (health_a, health_b):
              assert health.get('ok') is True, health
              assert health.get('protocol') == 'quantic-relay/1', health
              assert isinstance(health.get('relayId'), str) and len(health['relayId']) == 64, health
          assert health_a['relayId'] == health_b['relayId'], (health_a, health_b)
          print('Hostinger durable app health verified:', app_health.get('storage'), 'persistent_learning=', app_health.get('persistent_learning'))
          print('Hostinger Pulse storage verified:', pulse_health.get('storage'))
          print('Hostinger Quantic Relay verified:', health_a['relayId'])
          print('Hostinger production status API verified:', sorted(ids), 'mail=', mail)
          PY
