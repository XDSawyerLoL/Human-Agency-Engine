name: Hostinger Production Smoke

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'mairaiy_voice_service/**'
      - 'server.js'
      - 'server_core.js'
      - 'package.json'
      - '.github/workflows/hostinger-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed Providence and Mairaiy on Hostinger
        env:
          BASE_URL: https://mediumorchid-badger-314305.hostingersite.com
        run: |
          set -euo pipefail

          # Wait for Hostinger to serve the deployment that contains the new
          # voice-status contract. This detects actual production propagation,
          # not stale HTML/version strings.
          deployed=0
          for attempt in $(seq 1 45); do
            app_code="$(curl -sS --max-time 15 -o /tmp/app-health.json -w '%{http_code}' "$BASE_URL/api/health" || true)"
            voice_code="$(curl -sS --max-time 15 -o /tmp/voice-status.json -w '%{http_code}' "$BASE_URL/voice/status" || true)"
            schema="$(python - <<'PY'
          import json
          try:
              with open('/tmp/voice-status.json', encoding='utf-8') as f:
                  print(json.load(f).get('schema', ''))
          except Exception:
              print('')
          PY
          )"

            echo "attempt=$attempt app_http=$app_code voice_http=$voice_code voice_schema=$schema"
            if [ "$app_code" = "200" ]               && [ "$voice_code" = "200" ]               && [ "$schema" = "quantic-mairaiy-voice-proxy-v2" ]; then
              deployed=1
              break
            fi
            sleep 10
          done

          if [ "$deployed" != "1" ]; then
            echo "Hostinger did not expose the expected Mairaiy v2 production contract in time."
            echo "Last app health:"
            cat /tmp/app-health.json 2>/dev/null || true
            echo
            echo "Last voice status:"
            cat /tmp/voice-status.json 2>/dev/null || true
            exit 1
          fi

          pulse_code="$(curl -sS --max-time 20 -o /tmp/pulse-health.json -w '%{http_code}' "$BASE_URL/api/pulse/health" || true)"
          voice_code="$(curl -sS --max-time 20 -o /tmp/voice-status.json -w '%{http_code}' "$BASE_URL/voice/status" || true)"

          echo "App health:"
          cat /tmp/app-health.json
          echo
          echo "Pulse health:"
          cat /tmp/pulse-health.json
          echo
          echo "Mairaiy voice status:"
          cat /tmp/voice-status.json
          echo

          test "$pulse_code" = "200"
          test "$voice_code" = "200"

          python - <<'PY'
          import json

          with open('/tmp/app-health.json', encoding='utf-8') as f:
              app = json.load(f)
          with open('/tmp/pulse-health.json', encoding='utf-8') as f:
              pulse = json.load(f)
          with open('/tmp/voice-status.json', encoding='utf-8') as f:
              voice = json.load(f)

          assert app.get('service') == 'evidence-world-eye-node', app
          assert app.get('status') in {'ok', 'degraded', 'warming'}, app
          assert pulse.get('ok') is True, pulse

          assert voice.get('schema') == 'quantic-mairaiy-voice-proxy-v2', voice
          assert voice.get('configured') is True, (
              'Mairaiy same-site proxy is deployed but its Hostinger environment '
              'variables are not configured',
              voice,
          )
          assert voice.get('upstream_reachable') is True, (
              'Mairaiy upstream is configured but cannot be reached from mediumorchid',
              voice,
          )
          assert voice.get('state') == 'ready', voice
          assert voice.get('service') == 'mairaiy-kokoro', voice
          assert voice.get('engine') == 'kokoro-onnx', voice
          assert voice.get('voice') == 'ff_siwis', voice
          assert voice.get('language') == 'fr-fr', voice
          assert voice.get('identity_locked') is True, voice
          assert voice.get('model_ready') is True, (
              'Kokoro endpoint answers but its model/voice pack is not ready',
              voice,
          )

          print('Hostinger production app reachable:', app.get('status'))
          print('Pulse production reachable:', pulse.get('storage'))
          print(
              'Mairaiy production verified:',
              voice.get('engine'),
              voice.get('voice'),
              'model_ready=', voice.get('model_ready'),
          )
          PY
