name: Temporary AURA Hostinger Package

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-aura-hostinger-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout merged AURA revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ffa6cb6195af95b9e00c53f4467844664d0f3165

      - name: Build Hostinger source ZIP
        run: |
          zip -r AURA-Hostinger-main-ffa6cb6.zip . -x '.git/*' 'AURA-Hostinger-main-ffa6cb6.zip'

      - name: Upload source ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AURA-Hostinger-main-ffa6cb6
          path: AURA-Hostinger-main-ffa6cb6.zip
          if-no-files-found: error
          retention-days: 1
