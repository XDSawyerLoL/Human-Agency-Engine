name: Legacy Agency Cycle (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      ENGINE_URL: ${{ secrets.ENGINE_URL }}
      ENGINE_API_KEY: ${{ secrets.ENGINE_API_KEY }}
    steps:
      - name: Trigger proactive engine cycle
        shell: bash
        run: |
          if [ -z "$ENGINE_URL" ] || [ -z "$ENGINE_API_KEY" ]; then
            echo "Legacy Agency endpoint not configured; nothing to run."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 180 \
            -X POST "${ENGINE_URL%/}/v1/cycle/run" \
            -H "X-API-Key: ${ENGINE_API_KEY}"
