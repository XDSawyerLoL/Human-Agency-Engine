name: Sync QuanticMail into Hostinger portal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-quanticmail-static.yml'

permissions:
  contents: write

concurrency:
  group: sync-quanticmail-static
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync QuanticMail with compatible QR device pairing
        env:
          QUANTIC_HOSTINGER_RELAY_URL: https://mediumorchid-badger-314305.hostingersite.com
        run: |
          set -euo pipefail
          node scripts/sync-quantic-mail.mjs
          node scripts/test-quantic-mail-qr-compat.mjs
          node scripts/test-quantic-mail-hostinger-sync.mjs

      - name: Verify Quantic ID gate and patched pairing bundle
        run: |
          set -euo pipefail
          test -f public/mail/devices/index.html
          grep -q 'quantic-mail-id-gate.js' public/mail/devices/index.html
          grep -q 'site-nav.js' public/mail/index.html
          test -f public/mail/QUANTICMAIL_COMMIT
          grep -q '9aa0d89b3e008eee909b850bc5a1775b75ddcbfe' public/mail/QUANTICMAIL_COMMIT
          grep -q 'Retrouvez votre boîte Mail' public/mail/index.html
          node scripts/test-quantic-mail-qr-compat.mjs
          echo "Native QuanticMail 1.3 secure pairing distribution verified."

      - name: Commit synchronized native Mail to site repository
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/mail && [ -z "$(git ls-files --others --exclude-standard public/mail)" ]; then
            echo "QuanticMail files already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/mail
          git commit -m "fix(mail): deploy repaired QR device pairing bundle and Quantic ID gate"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
