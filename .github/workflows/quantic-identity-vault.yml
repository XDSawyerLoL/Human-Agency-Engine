name: Quantic Identity Vault

on:
  pull_request:
    paths:
      - 'identity-vault/**'
      - '.github/workflows/quantic-identity-vault.yml'
  push:
    branches: [main]
    paths:
      - 'identity-vault/**'
      - '.github/workflows/quantic-identity-vault.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      - name: Install Identity Vault dependencies
        working-directory: identity-vault
        run: npm install

      - name: Test Identity Vault cryptography
        working-directory: identity-vault
        run: npm test

      - name: Test Quantic Hardware Key QHK/1 contract
        run: node scripts/test-quantic-hardware-key-contract.mjs

      - name: Build Windows installer
        working-directory: identity-vault
        run: npm run dist:setup

      - name: Build portable USB executable
        working-directory: identity-vault
        run: npm run dist:portable

      - name: Verify release files
        shell: pwsh
        run: |
          if (!(Test-Path "identity-vault/dist/Quantic-Identity-Vault-Setup.exe")) { throw "Setup executable missing" }
          if (!(Test-Path "identity-vault/dist/Quantic-Identity-Vault-Portable.exe")) { throw "Portable executable missing" }
          Get-FileHash "identity-vault/dist/Quantic-Identity-Vault-Setup.exe" -Algorithm SHA256
          Get-FileHash "identity-vault/dist/Quantic-Identity-Vault-Portable.exe" -Algorithm SHA256

      - name: Resolve release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $pkg = Get-Content "identity-vault/package.json" | ConvertFrom-Json
          "VERSION=$($pkg.version)" >> $env:GITHUB_ENV
          "TAG=quantic-identity-vault-v$($pkg.version)" >> $env:GITHUB_ENV

      - name: Prepare versioned release files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Copy-Item "identity-vault/dist/Quantic-Identity-Vault-Setup.exe" "identity-vault/dist/Quantic-Identity-Vault-Setup-$env:VERSION.exe"
          Copy-Item "identity-vault/dist/Quantic-Identity-Vault-Portable.exe" "identity-vault/dist/Quantic-Identity-Vault-Portable-$env:VERSION.exe"

      - name: Publish Identity Vault release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:TAG" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:TAG" --target "$env:GITHUB_SHA" --title "Quantic Identity Vault v$env:VERSION" --prerelease --notes "Quantic Identity Vault v$env:VERSION ajoute le protocole ouvert Quantic Hardware Key QHK/1. Identity Vault peut désormais créer et utiliser une identité dont la clé privée P-256 reste dans un périphérique USB HID sécurisé et ne sort jamais dans le coffre ni vers Sillage. Les identités USB Ed25519 existantes restent compatibles. Le mode Hardware exige un périphérique QHK/1 réel avec élément sécurisé ; une clé USB de stockage ordinaire ne fournit pas cette garantie."
          }
          gh release upload "$env:TAG" "identity-vault/dist/Quantic-Identity-Vault-Setup-$env:VERSION.exe" "identity-vault/dist/Quantic-Identity-Vault-Portable-$env:VERSION.exe" --clobber
