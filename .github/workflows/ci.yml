name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app scripts migrations
      - name: Validate migrations
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./migration-test.db
          API_KEY: change-me
        run: |
          rm -f migration-test.db
          alembic upgrade head
          alembic current
      - name: Validate Hostinger compose
        env:
          HORIZON_POSTGRES_PASSWORD: test0123456789abcdef0123456789abcdef
          HORIZON_API_KEY: test-api-key-0123456789abcdef0123456789abcdef
          HORIZON_TOKEN_ENCRYPTION_KEY: test-encryption-key
        run: docker compose -f docker-compose.hostinger.yml config >/dev/null
      - name: Run tests
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./test.db
          API_KEY: change-me
        run: |
          rm -f test.db
          pytest -q
