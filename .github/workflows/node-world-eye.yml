name: Node World Eye CI

on:
  pull_request:
    paths:
      - 'package.json'
      - 'server.js'
      - 'server_core.js'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/node-world-eye.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'server.js'
      - 'server_core.js'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/node-world-eye.yml'

jobs:
  node-world-eye:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run build

      - name: Start Providence and verify product-critical routes
        run: |
          npm start >/tmp/providence.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; cat /tmp/providence.log' EXIT

          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json; then ok=1; break; fi
            sleep 0.5
          done
          test "$ok" = "1"
          node -e "const x=require('/tmp/health.json'); if(x.service!=='evidence-world-eye-node'||x.port!==3000) process.exit(1); console.log('health ok')"

          # Analyst is a required product route. A 404 must fail the build.
          curl -fsS http://127.0.0.1:3000/api/analyst/status >/tmp/analyst-status.json
          node -e "const x=require('/tmp/analyst-status.json'); if(x.schema!=='providence-analyst-status-v1'||x.superposition_engine!==true) process.exit(1); console.log('analyst status ok')"

          curl -fsS 'http://127.0.0.1:3000/api/superposition?limit=4' >/tmp/superposition.json
          node -e "const x=require('/tmp/superposition.json'); if(x.schema!=='providence-superposition-v1'||!Array.isArray(x.worlds)) process.exit(1); console.log('superposition ok')"

          curl -fsS -X POST http://127.0.0.1:3000/api/analyst/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"Que vois-tu venir en priorité ?","mode":"analyst"}' >/tmp/analyst-chat.json
          node -e "const x=require('/tmp/analyst-chat.json'); if(x.schema!=='providence-analyst-response-v1'||typeof x.text!=='string'||!x.text.length) process.exit(1); console.log('analyst chat ok')"

          curl -fsS http://127.0.0.1:3000/api/track-record >/tmp/track.json
          node -e "const x=require('/tmp/track.json'); if(typeof x.tracked_scenarios!=='number'||!x.calibration) process.exit(1); console.log('track record ok')"

          curl -fsS http://127.0.0.1:3000/api/sports/catalog >/tmp/sports.json
          node -e "const x=require('/tmp/sports.json'); if(x.schema!=='evidence-sports-catalog-v2'||!Array.isArray(x.countries)||!x.countries.length) process.exit(1); console.log('sports catalog ok')"

          curl -fsS http://127.0.0.1:3000/analyst/ >/tmp/analyst-page.html
          grep -q 'Interrogez directement' /tmp/analyst-page.html
          grep -q 'SCÉNARIOS CONCURRENTS' /tmp/analyst-page.html

          curl -fsS http://127.0.0.1:3000/predictions/ >/tmp/predictions-page.html
          grep -q 'Détails & sources' /tmp/predictions-page.html
          grep -q 'SIGNAUX DÉTERMINANTS' /tmp/predictions-page.html

          curl -fsS http://127.0.0.1:3000/sports/ >/tmp/sports-page.html
          grep -q 'Prédire. Puis vérifier.' /tmp/sports-page.html
          grep -q 'PREUVE EN CONDITIONS RÉELLES' /tmp/sports-page.html

          curl -fsS http://127.0.0.1:3000/providence-v16-product-cleanup.css >/tmp/cleanup.css
          grep -q 'Providence V16.7' /tmp/cleanup.css

          echo 'Providence V16.7 product smoke test ok'
