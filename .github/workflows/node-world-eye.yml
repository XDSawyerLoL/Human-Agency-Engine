name: Node World Eye CI

on:
  pull_request:
    paths:
      - 'package.json'
      - 'server.js'
      - 'src/**'
      - 'public/**'
      - 'supabase/**'
      - '.github/workflows/node-world-eye.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'server.js'
      - 'src/**'
      - 'public/**'
      - 'supabase/**'
      - '.github/workflows/node-world-eye.yml'

jobs:
  node-world-eye:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run check
      - name: Smoke-test multi-horizon predictor without network
        run: |
          node --input-type=module <<'NODE'
          import { buildForecasts } from './src/predictor.js';
          const now = new Date().toISOString();
          const common = {source_key:'test',source_label:'Test',source_family:'official_primary',source_trust:.95,observed_at:now,event_at:now,severity:.8,url:'',facts:{}};
          const rows = buildForecasts([
            {...common,event_type:'major_earthquake',title:'Séisme test',geography:'Zone test'},
            {...common,event_type:'media_geopolitical_trade',title:'Signal commerce test',geography:'Monde'}
          ],36);
          if (rows.length < 5) throw new Error(`not enough distinct forecasts: ${rows.length}`);
          if (rows.some(r => r.headline.includes('Séisme test'))) throw new Error('forecast merely repeats current event');
          if (!rows.every(r => r.falsification && r.time_window?.end_at)) throw new Error('forecast contract incomplete');
          if (!rows.some(r => r.horizon_tier === 'immediate')) throw new Error('immediate horizon missing');
          if (!rows.some(r => r.horizon_tier === 'medium')) throw new Error('medium horizon missing');
          if (!rows.some(r => r.horizon_tier === 'long')) throw new Error('long horizon missing');
          if (!rows.some(r => r.horizon_tier === 'strategic')) throw new Error('strategic horizon missing');
          console.log(rows.map(r => `${r.horizon_tier}:${r.probability.percent}%:${r.headline}`).join('\n'));
          NODE
      - name: Start Express and verify V11.1 Providence endpoints
        run: |
          npm start >/tmp/evidence-node.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; cat /tmp/evidence-node.log' EXIT
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json; then ok=1; break; fi
            sleep 0.5
          done
          test "$ok" = "1"
          node -e "const x=require('/tmp/health.json'); if(x.service!=='evidence-world-eye-node'||x.port!==3000||typeof x.causal_learning_ready!=='boolean'||x.sports_intelligence_ready!==true) process.exit(1); console.log('health endpoint ok')"
          curl -fsS http://127.0.0.1:3000/api/modules >/tmp/modules.json
          node -e "const x=require('/tmp/modules.json'); const keys=new Set((x.modules||[]).map(m=>m.key)); for(const k of ['gdelt','pubmed','arxiv','polymarket','trends','fred','metaculus','windy']) if(!keys.has(k)) process.exit(1); console.log('modules endpoint ok')"
          curl -fsS http://127.0.0.1:3000/api/track-record >/tmp/track.json
          node -e "const x=require('/tmp/track.json'); if(typeof x.tracked_scenarios!=='number'||!x.calibration||!x.resolution||!x.ensemble||!x.causal_learning) process.exit(1); console.log('track record endpoint ok')"
          curl -fsS http://127.0.0.1:3000/api/causal-graph >/tmp/causal.json
          node -e "const x=require('/tmp/causal.json'); if(x.schema!=='evidence-causal-world-v1'||!Array.isArray(x.nodes)||!Array.isArray(x.edges)||!x.metrics) process.exit(1); console.log('causal world endpoint ok')"
          curl -fsS http://127.0.0.1:3000/api/sports/catalog >/tmp/sports-catalog.json
          node -e "const x=require('/tmp/sports-catalog.json'); if(x.schema!=='evidence-sports-catalog-v2'||!Array.isArray(x.countries)||!x.countries.length) process.exit(1); console.log('sports catalog endpoint ok')"
          curl --max-time 30 -fsS 'http://127.0.0.1:3000/api/sports/league?country=England&league=Premier%20League&competition_id=2&season_id=27' >/tmp/sports-league.json
          curl --max-time 30 -fsS 'http://127.0.0.1:3000/api/sports/league?country=England&league=Premier%20League&competition_id=2&season_id=44' >/tmp/sports-alt.json
          node <<'NODE'
          const a=require('/tmp/sports-league.json'),b=require('/tmp/sports-alt.json');
          if(a.schema!=='evidence-sports-intelligence-v3'||a.competition?.country!=='England'||typeof a.historical?.multiclass_brier!=='number'||a.model?.trained_only_on_prior_matches!==true) process.exit(1);
          if(a.upcoming?.provider!=='OpenFootball'||!Array.isArray(a.upcoming?.fixtures)||a.upcoming.fixtures.length<8||a.track_record?.schema!=='evidence-sports-track-record-v1') process.exit(1);
          if(a.model?.production_model?.independent_of_selected_backtest_season!==true||a.model.production_model.id!==b.model?.production_model?.id) process.exit(1);
          const f=a.upcoming.fixtures[0],g=(b.upcoming?.fixtures||[]).find(x=>x.fixture_key===f.fixture_key);
          if(!g||JSON.stringify(f.probabilities)!==JSON.stringify(g.probabilities)||f.model_id!==g.model_id) process.exit(1);
          if((a.upcoming.fixtures||[]).some(x=>x.trackable!==true||Date.parse(x.utc_date)<=Date.now())) process.exit(1);
          console.log('sports canonical future slate + live track record ok',a.upcoming.provider,a.upcoming.fixtures.length,f.model_id);
          NODE
          curl -fsS http://127.0.0.1:3000/sports/ >/tmp/sports-page.html
          grep -q 'TRACK RECORD RÉEL' /tmp/sports-page.html
          curl -fsS http://127.0.0.1:3000/api/supabase >/tmp/supabase.json
          node -e "const x=require('/tmp/supabase.json'); if(typeof x.configured!=='boolean'||typeof x.connected!=='boolean') process.exit(1); console.log('supabase bridge status ok')"
          curl -fsS http://127.0.0.1:3000/api/storage >/tmp/storage.json
          node -e "const x=require('/tmp/storage.json'); if(typeof x.persistent!=='boolean'||!Array.isArray(x.accepted_configuration)||!x.supabase) process.exit(1); console.log('storage endpoint ok')"
          curl -fsS -X POST http://127.0.0.1:3000/api/forecast/compile -H 'Content-Type: application/json' -d '{"question":"La production nucléaire française augmentera-t-elle avant 2030 ?"}' >/tmp/compiler.json
          node -e "const x=require('/tmp/compiler.json'); if(x.schema!=='evidence-forecast-compiler-v1'||!Array.isArray(x.sub_forecasts)||x.sub_forecasts.length<4) process.exit(1); console.log('forecast compiler endpoint ok')"
