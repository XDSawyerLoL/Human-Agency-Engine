name: QuanticMail Mobile Production Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quanticmail-mobile-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live QuanticMail bundle and relay failover
        env:
          BASE_URL: https://mediumorchid-badger-314305.hostingersite.com
          EXPECTED_MAIL_COMMIT: 7ada69845830b3253795abf24f8554877ae4b6d5
          FALLBACK_RELAY: https://quanticmail-network-relay.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            manifest="$(curl -fsSL --max-time 20 "$BASE_URL/mail/QUANTICMAIL_COMMIT" 2>/dev/null | tr -d '\r\n' || true)"
            mail_status="$(curl -sS -o /tmp/quantic-mail.html -w '%{http_code}' --max-time 20 "$BASE_URL/mail/" || true)"

            if [[ "$manifest" == "$EXPECTED_MAIL_COMMIT" ]] && [[ "$mail_status" == "200" ]] && [[ -s /tmp/quantic-mail.html ]]; then
              echo "Live QuanticMail bundle verified: $manifest"

              hostinger_status="$(curl -sS -o /tmp/hostinger-health.json -w '%{http_code}' --max-time 20 "$BASE_URL/api/quantic/health" || true)"
              if [[ "$hostinger_status" == "200" ]]; then
                echo "Hostinger relay is healthy."
                ready=1
                break
              fi

              echo "Hostinger relay returned $hostinger_status; checking durable fallback."
              fallback_status="$(curl -sS -D /tmp/fallback-headers.txt -o /tmp/fallback-health.json -w '%{http_code}' --max-time 25 -H "Origin: $BASE_URL" "$FALLBACK_RELAY/api/quantic/health" || true)"
              if [[ "$fallback_status" == "200" ]] && grep -qi '^access-control-allow-origin: \*' /tmp/fallback-headers.txt; then
                grep -q '"ok":true' /tmp/fallback-health.json
                echo "Durable Quantic relay fallback verified with CORS."
                ready=1
                break
              fi

              echo "Fallback relay not ready: HTTP $fallback_status"
            fi

            echo "Waiting for Hostinger Mail deploy (attempt $attempt/36): manifest=$manifest mail_status=$mail_status"
            sleep 10
          done

          test "$ready" = "1"
