name: Fix Identity Vault 0.2.0 release notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-identity-vault-release-notes.yml'

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Update Identity Vault 0.2.0 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "quantic-identity-vault-v0.2.0" \
            --repo "${{ github.repository }}" \
            --notes "Quantic Identity Vault v0.2.0 sépare le chargement du coffre du déverrouillage : un fichier de coffre peut être chargé sans saisir le code local. Le code est demandé uniquement pour déchiffrer l’identité. Le format v2 chiffre la clé privée et le profil personnel (photo, état civil, coordonnées, adresse, activité, contact d’urgence et informations complémentaires) et conserve la compatibilité avec les coffres v1. Inclut un installateur Windows et une version portable USB. Les exécutables ne sont pas encore signés avec un certificat Windows public : SmartScreen peut afficher un avertissement."
