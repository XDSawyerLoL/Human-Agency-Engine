name: horizon

x-horizon-environment: &horizon-environment
  APP_ENV: production
  DATABASE_URL: postgresql://horizon:${HORIZON_POSTGRES_PASSWORD:?HORIZON_POSTGRES_PASSWORD is required}@db:5432/horizon
  API_KEY: ${HORIZON_API_KEY:?HORIZON_API_KEY is required}
  TOKEN_ENCRYPTION_KEY: ${HORIZON_TOKEN_ENCRYPTION_KEY:?HORIZON_TOKEN_ENCRYPTION_KEY is required}
  METEOFRANCE_APPLICATION_ID: ${METEOFRANCE_APPLICATION_ID:-}
  WINDY_POINT_FORECAST_API_KEY: ${WINDY_POINT_FORECAST_API_KEY:-}
  FRED_API_KEY: ${FRED_API_KEY:-}
  METACULUS_API_KEY: ${METACULUS_API_KEY:-}
  COPERNICUS_API_KEY: ${COPERNICUS_API_KEY:-}
  FORECAST_API_KEY: ${FORECAST_API_KEY:-}
  POINT_API_KEY: ${POINT_API_KEY:-}
  HORIZON_COLLECTOR_ENABLED: ${HORIZON_COLLECTOR_ENABLED:-true}
  HORIZON_COLLECTOR_TICK_SECONDS: ${HORIZON_COLLECTOR_TICK_SECONDS:-30}
  HORIZON_COLLECTOR_LEASE_SECONDS: ${HORIZON_COLLECTOR_LEASE_SECONDS:-900}
  HORIZON_COLLECTOR_MAX_SOURCES_PER_CYCLE: ${HORIZON_COLLECTOR_MAX_SOURCES_PER_CYCLE:-10}
  HORIZON_COLLECTOR_SNCF_SECONDS: ${HORIZON_COLLECTOR_SNCF_SECONDS:-300}
  HORIZON_COLLECTOR_VIGICRUES_SECONDS: ${HORIZON_COLLECTOR_VIGICRUES_SECONDS:-600}
  HORIZON_COLLECTOR_METEOFRANCE_SECONDS: ${HORIZON_COLLECTOR_METEOFRANCE_SECONDS:-600}
  HORIZON_COLLECTOR_METEOALARM_SECONDS: ${HORIZON_COLLECTOR_METEOALARM_SECONDS:-600}
  HORIZON_COLLECTOR_GDELT_SECONDS: ${HORIZON_COLLECTOR_GDELT_SECONDS:-900}
  HORIZON_COLLECTOR_GDACS_SECONDS: ${HORIZON_COLLECTOR_GDACS_SECONDS:-900}
  HORIZON_COLLECTOR_FUEL_SECONDS: ${HORIZON_COLLECTOR_FUEL_SECONDS:-900}
  HORIZON_COLLECTOR_RTE_SECONDS: ${HORIZON_COLLECTOR_RTE_SECONDS:-900}
  HORIZON_COLLECTOR_WINDY_SECONDS: ${HORIZON_COLLECTOR_WINDY_SECONDS:-1800}
  HORIZON_COLLECTOR_WORLD_PULSE_SECONDS: ${HORIZON_COLLECTOR_WORLD_PULSE_SECONDS:-900}
  HORIZON_COLLECTOR_SYNTHESIS_SECONDS: ${HORIZON_COLLECTOR_SYNTHESIS_SECONDS:-900}
  HORIZON_COLLECTOR_MAX_ACTIVE_EVENTS: ${HORIZON_COLLECTOR_MAX_ACTIVE_EVENTS:-300}
  HORIZON_COLLECTOR_EVENT_GRAPH_LOOKBACK_HOURS: ${HORIZON_COLLECTOR_EVENT_GRAPH_LOOKBACK_HOURS:-336}
  HORIZON_COLLECTOR_METEOALARM_ALL_EUROPE: ${HORIZON_COLLECTOR_METEOALARM_ALL_EUROPE:-true}
  HORIZON_COLLECTOR_RTE_REGION_CODES: ${HORIZON_COLLECTOR_RTE_REGION_CODES:-}
  HORIZON_COLLECTOR_WINDY_POINTS_JSON: ${HORIZON_COLLECTOR_WINDY_POINTS_JSON:-[]}
  HORIZON_CORPUS_WORKER_ENABLED: ${HORIZON_CORPUS_WORKER_ENABLED:-true}
  HORIZON_CORPUS_WORKER_INTERVAL_SECONDS: ${HORIZON_CORPUS_WORKER_INTERVAL_SECONDS:-21600}
  HORIZON_CORPUS_WORKER_LEASE_SECONDS: ${HORIZON_CORPUS_WORKER_LEASE_SECONDS:-7200}
  HORIZON_CORPUS_WORKER_MAX_RUNS_PER_CYCLE: ${HORIZON_CORPUS_WORKER_MAX_RUNS_PER_CYCLE:-1}
  HORIZON_CORPUS_WORKER_SLICES_PER_RUN: ${HORIZON_CORPUS_WORKER_SLICES_PER_RUN:-1}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: horizon
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: ${HORIZON_POSTGRES_PASSWORD:?HORIZON_POSTGRES_PASSWORD is required}
    volumes:
      - horizon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon -d horizon"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - horizon_private

  api:
    build:
      context: .
      dockerfile: Dockerfile.horizon
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *horizon-environment
      PORT: 8000
    ports:
      - "${HORIZON_BIND_ADDRESS:-127.0.0.1}:${HORIZON_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - horizon_private

  init:
    build:
      context: .
      dockerfile: Dockerfile.horizon
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *horizon-environment
    command: ["python", "scripts/horizon_hostinger_init.py"]
    networks:
      - horizon_private

  collector:
    build:
      context: .
      dockerfile: Dockerfile.horizon
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: *horizon-environment
    command: ["python", "scripts/horizon_collector.py"]
    stop_grace_period: 30s
    networks:
      - horizon_private

  corpus-worker:
    build:
      context: .
      dockerfile: Dockerfile.horizon
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: *horizon-environment
    command: ["python", "scripts/horizon_corpus_worker.py"]
    stop_grace_period: 30s
    networks:
      - horizon_private

  snapshot:
    build:
      context: .
      dockerfile: Dockerfile.horizon
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: *horizon-environment
      EVIDENCE_PUBLIC_DIR: /public
      EVIDENCE_SNAPSHOT_INTERVAL_SECONDS: ${EVIDENCE_SNAPSHOT_INTERVAL_SECONDS:-300}
      EVIDENCE_FORECAST_LIMIT: ${EVIDENCE_FORECAST_LIMIT:-20}
    command: ["python", "scripts/evidence_snapshot_worker.py"]
    volumes:
      - horizon_evidence_public:/public
    stop_grace_period: 30s
    networks:
      - horizon_private

  mairaiy-voice:
    build:
      context: .
      dockerfile: Dockerfile.mairaiy-voice
    profiles: ["voice"]
    restart: unless-stopped
    environment:
      OMNIVOICE_API_KEY: ${OMNIVOICE_API_KEY:-}
      MAIRAIY_KOKORO_DIR: /models
      MAIRAIY_KOKORO_VOICE: ${MAIRAIY_KOKORO_VOICE:-ff_siwis}
      MAIRAIY_KOKORO_LANGUAGE: ${MAIRAIY_KOKORO_LANGUAGE:-fr-fr}
      MAIRAIY_KOKORO_SPEED: ${MAIRAIY_KOKORO_SPEED:-1.0}
      MAIRAIY_KOKORO_CHUNK_CHARS: ${MAIRAIY_KOKORO_CHUNK_CHARS:-430}
    expose:
      - "3900"
    volumes:
      - horizon_mairaiy_voice_data:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3900/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    stop_grace_period: 20s
    networks:
      - horizon_private

  software-repo-init:
    image: alpine:3.22
    profiles: ["software-agent"]
    restart: "no"
    user: "0:0"
    environment:
      SOFTWARE_AGENT_REPOSITORY_URL: ${SOFTWARE_AGENT_REPOSITORY_URL:-https://github.com/XDSawyerLoL/Human-Agency-Engine.git}
      SOFTWARE_AGENT_REPOSITORY_REF: ${SOFTWARE_AGENT_REPOSITORY_REF:-main}
    volumes:
      - /var/lib/aura-software/repos:/var/lib/aura-software/repos
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      apk add --no-cache git ca-certificates >/dev/null
      owner_dir=/var/lib/aura-software/repos/XDSawyerLoL
      repo_dir=$owner_dir/Human-Agency-Engine
      mkdir -p "$owner_dir"
      if [ ! -d "$repo_dir/.git" ]; then
        rm -rf "$repo_dir"
        git clone --filter=blob:none --branch "$SOFTWARE_AGENT_REPOSITORY_REF" "$SOFTWARE_AGENT_REPOSITORY_URL" "$repo_dir"
      else
        git -C "$repo_dir" remote set-url origin "$SOFTWARE_AGENT_REPOSITORY_URL"
        git -C "$repo_dir" fetch --prune origin "$SOFTWARE_AGENT_REPOSITORY_REF"
        git -C "$repo_dir" checkout -f "$SOFTWARE_AGENT_REPOSITORY_REF"
        git -C "$repo_dir" reset --hard "origin/$SOFTWARE_AGENT_REPOSITORY_REF"
        git -C "$repo_dir" clean -ffd
      fi
      git -C "$repo_dir" remote set-url --push origin disabled://push-prohibited
      git -C "$repo_dir" status --short --branch
    networks:
      - horizon_private

  openhands:
    image: ghcr.io/openhands/agent-server:${OPENHANDS_AGENT_SERVER_TAG:-3311ba9-python-amd64}
    profiles: ["software-agent"]
    restart: unless-stopped
    user: "0:0"
    environment:
      OH_CONVERSATION_RUNTIME: docker
      OH_CONVERSATION_IMAGE: ${OPENHANDS_CONVERSATION_IMAGE:-ghcr.io/openhands/agent-server:3311ba9-python-amd64}
      OH_SESSION_API_KEYS_0: ${SOFTWARE_AGENT_SESSION_API_KEY:?SOFTWARE_AGENT_SESSION_API_KEY is required}
      OH_SECRET_KEY: ${OPENHANDS_SECRET_KEY:?OPENHANDS_SECRET_KEY is required}
      OH_CONVERSATIONS_PATH: /var/lib/aura-software/openhands/conversations
      OH_PERSISTENCE_DIR: /var/lib/aura-software/openhands/persistence
      OH_ENABLE_VSCODE: "0"
      OH_PRELOAD_TOOLS: "1"
      OH_MAX_CONCURRENT_RUNS: ${OPENHANDS_MAX_CONCURRENT_RUNS:-2}
      OH_CONVERSATION_CONTAINER_MEMORY: ${OPENHANDS_CONVERSATION_MEMORY:-4g}
      OH_CONVERSATION_CONTAINER_CPUS: ${OPENHANDS_CONVERSATION_CPUS:-2}
      OH_CONVERSATION_CONTAINER_PIDS_LIMIT: ${OPENHANDS_CONVERSATION_PIDS_LIMIT:-512}
      OH_CONVERSATION_IDLE_TTL_SECONDS: ${OPENHANDS_CONVERSATION_IDLE_TTL_SECONDS:-1200}
    command: ["--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/aura-software/openhands:/var/lib/aura-software/openhands
      - /var/lib/aura-software/repos:/var/lib/aura-software/repos
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).read()"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - horizon_private

  openhands-profile-init:
    build:
      context: .
      dockerfile: Dockerfile.horizon
    profiles: ["software-agent"]
    restart: "no"
    depends_on:
      openhands:
        condition: service_healthy
      software-repo-init:
        condition: service_completed_successfully
    environment:
      OPENHANDS_BASE_URL: http://openhands:8000
      OPENHANDS_SESSION_API_KEY: ${SOFTWARE_AGENT_SESSION_API_KEY:?SOFTWARE_AGENT_SESSION_API_KEY is required}
      SOFTWARE_AGENT_LLM_PROFILE_NAME: ${SOFTWARE_AGENT_LLM_PROFILE_NAME:-aura-local}
      SOFTWARE_AGENT_PROFILE_NAME: ${SOFTWARE_AGENT_PROFILE_NAME:-aura-software}
      SOFTWARE_AGENT_LLM_MODEL: ${SOFTWARE_AGENT_LLM_MODEL:?SOFTWARE_AGENT_LLM_MODEL is required}
      SOFTWARE_AGENT_LLM_BASE_URL: ${SOFTWARE_AGENT_LLM_BASE_URL:?SOFTWARE_AGENT_LLM_BASE_URL is required}
      SOFTWARE_AGENT_LLM_API_KEY: ${SOFTWARE_AGENT_LLM_API_KEY:-local-llm}
      SOFTWARE_AGENT_PROFILE_ID_FILE: /software-control/agent-profile-id
    command: ["python", "scripts/bootstrap_openhands_profile.py"]
    volumes:
      - horizon_software_control:/software-control
    networks:
      - horizon_private

  software-control:
    build:
      context: .
      dockerfile: Dockerfile.horizon
    profiles: ["software-agent"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      openhands-profile-init:
        condition: service_completed_successfully
      software-repo-init:
        condition: service_completed_successfully
    environment:
      <<: *horizon-environment
      PORT: 8001
      SOFTWARE_AGENT_ENABLED: "true"
      SOFTWARE_AGENT_BASE_URL: http://openhands:8000
      SOFTWARE_AGENT_PRIVATE_NETWORK_HTTP: "true"
      SOFTWARE_AGENT_SESSION_API_KEY: ${SOFTWARE_AGENT_SESSION_API_KEY:?SOFTWARE_AGENT_SESSION_API_KEY is required}
      SOFTWARE_AGENT_AGENT_PROFILE_ID_FILE: /software-control/agent-profile-id
      SOFTWARE_AGENT_WORKSPACE_ROOT: /var/lib/aura-software/repos
      SOFTWARE_AGENT_ALLOWED_REPOSITORIES: ${SOFTWARE_AGENT_ALLOWED_REPOSITORIES:-XDSawyerLoL/Human-Agency-Engine}
      SOFTWARE_AGENT_MAX_ITERATIONS: ${SOFTWARE_AGENT_MAX_ITERATIONS:-80}
      SOFTWARE_AGENT_TIMEOUT_SECONDS: ${SOFTWARE_AGENT_TIMEOUT_SECONDS:-20}
      SOFTWARE_AGENT_REQUIRE_ATTESTATION: "true"
      AURA_CLOUD_URL: ${AURA_CLOUD_URL:-https://antiquewhite-dolphin-780448.hostingersite.com}
      AURA_CLOUD_TOKEN: ${AURA_CLOUD_TOKEN:-}
    command:
      - sh
      - -ec
      - "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8001 --proxy-headers"
    ports:
      - "${SOFTWARE_CONTROL_BIND_ADDRESS:-127.0.0.1}:${SOFTWARE_CONTROL_PORT:-8001}:8001"
    volumes:
      - horizon_software_control:/software-control:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=5).read()"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - horizon_private

  software-control-init:
    build:
      context: .
      dockerfile: Dockerfile.horizon
    profiles: ["software-agent"]
    restart: "no"
    depends_on:
      software-control:
        condition: service_healthy
    environment:
      HORIZON_API_KEY: ${HORIZON_API_KEY:?HORIZON_API_KEY is required}
      SOFTWARE_CONTROL_BASE_URL: http://software-control:8001
    command: ["python", "scripts/bootstrap_software_control.py"]
    networks:
      - horizon_private

  web:
    build:
      context: .
      dockerfile: Dockerfile.evidence-web
    restart: unless-stopped
    depends_on:
      snapshot:
        condition: service_started
    ports:
      - "${EVIDENCE_BIND_ADDRESS:-0.0.0.0}:${EVIDENCE_HTTP_PORT:-8080}:80"
    volumes:
      - horizon_evidence_public:/usr/share/nginx/html/data:ro
    networks:
      - horizon_private

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${HORIZON_POSTGRES_PASSWORD:?HORIZON_POSTGRES_PASSWORD is required}
      HORIZON_BACKUP_INTERVAL_SECONDS: ${HORIZON_BACKUP_INTERVAL_SECONDS:-86400}
      HORIZON_BACKUP_RETENTION_DAYS: ${HORIZON_BACKUP_RETENTION_DAYS:-7}
    volumes:
      - horizon_postgres_backups:/backups
    command:
      - sh
      - -ec
      - |
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          tmp="/backups/horizon-$${ts}.dump.tmp"
          out="/backups/horizon-$${ts}.dump"
          pg_dump -h db -U horizon -d horizon -Fc > "$${tmp}"
          mv "$${tmp}" "$${out}"
          find /backups -type f -name 'horizon-*.dump' -mtime +$${HORIZON_BACKUP_RETENTION_DAYS} -delete
          sleep "$${HORIZON_BACKUP_INTERVAL_SECONDS}"
        done
    networks:
      - horizon_private

volumes:
  horizon_postgres_data:
  horizon_evidence_public:
  horizon_postgres_backups:
  horizon_mairaiy_voice_data:
  horizon_software_control:

networks:
  horizon_private:
    driver: bridge
