server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # AURA Voice Fabric. The backend is resolved lazily so ÉVIDENCE still
    # starts when the optional Docker profile "voice" is disabled.
    location /voice/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $mairaiy_voice_backend http://mairaiy-voice:3900;
        rewrite ^/voice/(.*)$ /$1 break;
        proxy_pass $mairaiy_voice_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /voice;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 24m;
        add_header Cache-Control "no-store" always;
    }

    location /api/quantic-portal/ {
        proxy_pass http://api:8000/v1/quantic/portal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        add_header Cache-Control "no-store" always;
    }

    location /data/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    location = /cameras {
        return 308 /cameras/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
